name: Initialize Android signing

on:
  workflow_dispatch:
    inputs:
      rotate:
        description: Replace existing signing key (only for a new application ID)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: initialize-android-signing
  cancel-in-progress: false

jobs:
  initialize-signing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.SIGNING_SETUP_TOKEN }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      BACKUP_PASSWORD: ${{ secrets.SIGNING_BACKUP_PASSWORD }}

    steps:
      - name: Validate setup secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo '::error::SIGNING_SETUP_TOKEN is missing'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo '::error::ANDROID_KEYSTORE_PASSWORD is missing'; exit 1; }
          test -n "$BACKUP_PASSWORD" || { echo '::error::SIGNING_BACKUP_PASSWORD is missing'; exit 1; }
          test "$KEYSTORE_PASSWORD" != "$BACKUP_PASSWORD" || { echo '::error::The two passwords must be different'; exit 1; }

      - name: Select repository signing identity
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REPOSITORY" in
            yutan123/TideBot-Dev)
              echo 'KEY_ALIAS=skytide-dev' >> "$GITHUB_ENV"
              echo 'KEY_DN=CN=SkyTide Dev, OU=Development, O=SkyTide, C=CN' >> "$GITHUB_ENV"
              echo 'KEYSTORE_NAME=skytide-dev.keystore' >> "$GITHUB_ENV"
              ;;
            yutan123/TideBot)
              echo 'KEY_ALIAS=skytide-release' >> "$GITHUB_ENV"
              echo 'KEY_DN=CN=SkyTide, OU=Release, O=SkyTide, C=CN' >> "$GITHUB_ENV"
              echo 'KEYSTORE_NAME=skytide-release.keystore' >> "$GITHUB_ENV"
              ;;
            *)
              echo "::error::Unexpected repository: $GITHUB_REPOSITORY"
              exit 1
              ;;
          esac

      - name: Validate rotation and back up existing signing key
        shell: bash
        env:
          ROTATE: ${{ inputs.rotate }}
          OLD_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          OLD_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OLD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          secrets=$(gh secret list --repo "$GITHUB_REPOSITORY" --json name --jq '.[].name')
          if [[ "$ROTATE" != true ]]; then
            if grep -qx ANDROID_KEYSTORE_BASE64 <<< "$secrets"; then
              echo '::error::Signing already exists; explicit rotation is required.'
              exit 1
            fi
            exit 0
          fi
          grep -qx ANDROID_KEYSTORE_BASE64 <<< "$secrets"
          if grep -qx ANDROID_PREVIOUS_KEYSTORE_BASE64 <<< "$secrets"; then
            echo '::error::A rollback key already exists; refusing another rotation.'
            exit 1
          fi
          test -n "$OLD_KEYSTORE"
          if [[ -z "$OLD_ALIAS" || "$OLD_KEY_PASSWORD" != "$KEYSTORE_PASSWORD" ]]; then
            echo '::error::Rotation requires an existing alias and matching key/store passwords.'
            exit 1
          fi
          printf 'KEY_ALIAS=%s\n' "$OLD_ALIAS" >> "$GITHUB_ENV"
          old=$(mktemp)
          restored=$(mktemp)
          trap 'rm -f "$old" "$restored"' EXIT
          printf '%s' "$OLD_KEYSTORE" | base64 --decode > "$old"
          keytool -certreq -keystore "$old" -alias "$OLD_ALIAS" \
            -storepass:env KEYSTORE_PASSWORD -keypass:env OLD_KEY_PASSWORD > /dev/null
          printf '%s\n' "$BACKUP_PASSWORD" | gpg --batch --pinentry-mode loopback \
            --passphrase-fd 0 --symmetric --cipher-algo AES256 \
            --output previous-signing.keystore.gpg "$old"
          printf '%s\n' "$BACKUP_PASSWORD" | gpg --batch --yes --pinentry-mode loopback \
            --passphrase-fd 0 --output "$restored" --decrypt previous-signing.keystore.gpg
          cmp "$old" "$restored"
          tar -czf previous-signing-backup.tar.gz previous-signing.keystore.gpg

      - name: Generate signing keystore
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE_NAME" \
            -storetype PKCS12 \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 3072 \
            -validity 10950 \
            -dname "$KEY_DN"
          base64 -w 0 "$KEYSTORE_NAME" > keystore.base64
          sha256sum "$KEYSTORE_NAME" > keystore.sha256

      - name: Create encrypted backup
        shell: bash
        run: |
          set -euo pipefail
          gpg --batch --yes --pinentry-mode loopback \
            --passphrase "$BACKUP_PASSWORD" \
            --symmetric --cipher-algo AES256 \
            --output "$KEYSTORE_NAME.gpg" "$KEYSTORE_NAME"
          tar -czf "${KEYSTORE_NAME%.keystore}-backup.tar.gz" \
            "$KEYSTORE_NAME.gpg" keystore.sha256

      - name: Upload encrypted backup
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event.repository.name }}-signing-backup
          path: '*-backup.tar.gz'
          if-no-files-found: error
          retention-days: 7

      - name: Save repository signing secrets
        shell: bash
        env:
          ROTATE: ${{ inputs.rotate }}
          OLD_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ "$ROTATE" == true ]]; then
            printf '%s' "$OLD_KEYSTORE" | gh secret set ANDROID_PREVIOUS_KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY"
            gh secret set ANDROID_KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY" < keystore.base64
            exit 0
          fi
          gh secret set ANDROID_KEY_ALIAS --repo "$GITHUB_REPOSITORY" --body "$KEY_ALIAS"
          gh secret set ANDROID_KEY_PASSWORD --repo "$GITHUB_REPOSITORY" --body "$KEYSTORE_PASSWORD"
          gh secret set ANDROID_KEYSTORE_BASE64 --repo "$GITHUB_REPOSITORY" < keystore.base64
